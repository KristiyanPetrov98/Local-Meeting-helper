name: Windows installer candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packaging/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package*.json'
      - 'electron-builder.yml'
      - 'global.json'
      - '.github/workflows/m6-windows-installer.yml'
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PYANNOTE_METRICS_ENABLED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - run: |
          New-Item -ItemType Directory -Force build | Out-Null
          try {
            & .\scripts\package-windows.ps1 *>&1 | Tee-Object -FilePath build/windows-build.log
          } catch {
            $failure = ($_ | Out-String) + "`n" + $_.ScriptStackTrace
            foreach ($entry in [Environment]::GetEnvironmentVariables().GetEnumerator()) {
              if ($entry.Key -match 'TOKEN|SECRET|PASSWORD|API_KEY' -and ([string]$entry.Value).Length -ge 8) { $failure = $failure.Replace([string]$entry.Value, '[redacted]') }
            }
            $failure | Out-File -FilePath build/windows-build.log -Encoding utf8 -Append
            throw
          }
        shell: pwsh
      - name: Start packaged desktop and exercise bundled workflows
        shell: pwsh
        env:
          PM_PACKAGED_APP: ${{ github.workspace }}\release\win-unpacked\PM Copilot.exe
        run: |
          & npx playwright test tests/e2e/m6-package.spec.ts *>&1 | Tee-Object -FilePath build/windows-build.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: pm-copilot-windows-installer-candidate
          path: |
            release/*Setup.exe
            release/SHA256SUMS.txt
            build/notices/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pm-copilot-windows-build-diagnostics
          path: |
            build/windows-build.log
            build/notices/**
      - name: Summarize build failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build/windows-build.log) {
            $tail = (Get-Content build/windows-build.log -Tail 100) -join "`n"
            foreach ($entry in [Environment]::GetEnvironmentVariables().GetEnumerator()) {
              if ($entry.Key -match 'TOKEN|SECRET|PASSWORD|API_KEY' -and ([string]$entry.Value).Length -ge 8) { $tail = $tail.Replace([string]$entry.Value, '[redacted]') }
            }
            @('### Windows packaging diagnostic', '', '```text', $tail, '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            if ($tail.Length -gt 3500) { $tail = $tail.Substring($tail.Length - 3500) }
            $annotation = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows packaging diagnostic::$annotation"
          }
# Builds a candidate; does not publish, sign, or qualify a clean Windows laptop.
